worker_processes 1;
error_log /dev/stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /run/nginx/client_body;
    proxy_temp_path /run/nginx/proxy;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 7681;

        # Ingress authenticates at the Supervisor. Check the socket peer, never
        # a client-supplied forwarding header, before proxying HTTP or WebSockets.
        allow 172.30.32.2;
        deny all;

        location / {
            proxy_pass http://127.0.0.1:7682;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }
    }
}
